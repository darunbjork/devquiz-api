services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/devquiz
      - JWT_SECRET_KEY=dev-secret-key
      - JWT_REFRESH_SECRET=dev-refresh-secret
      - NODE_ENV=development
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
